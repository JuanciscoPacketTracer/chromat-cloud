log_format chromat_json escape=json
    '{"event":"http_request","request":"$request","status":$status,'
    '"request_time":$request_time,"body_bytes_sent":$body_bytes_sent,'
    '"remote_addr":"$remote_addr","host":"$host"}';

server {
    listen 443 ssl;
    server_name chromat.lan localhost;

    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 10m;
    access_log /dev/stdout chromat_json;
    error_log /dev/stderr warn;

    location = / {
        return 302 /panel/;
    }

    location /panel/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /panel/index.html;
    }

    location / {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
