services:
  db:
    image: ${CHROMAT_DB_IMAGE}
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      TZ: UTC
    volumes:
      - db_data:/var/lib/mysql
      - ../../db/migrations:/docker-entrypoint-initdb.d:ro
      - ${DB_PASSWORD_HOST_FILE}:/run/secrets/db_password:ro
      - ${DB_ROOT_PASSWORD_HOST_FILE}:/run/secrets/db_root_password:ro
    networks:
      - smoke
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mariadb -h 127.0.0.1 -u root -p\"$$(cat /run/secrets/db_root_password)\" \"$${MARIADB_DATABASE}\" -e \"SELECT 1 FROM schema_migrations WHERE version = '001_initial' LIMIT 1\" --skip-column-names | grep -q 1",
        ]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    build:
      context: ../../api
      dockerfile: Dockerfile
    image: ${CHROMAT_API_IMAGE}
    environment:
      APP_ENV: smoke
      API_PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD_FILE: /run/secrets/db_password
      RAW_DATA_DIR: /app/uploads
      RAW_MIN_FREE_PERCENT: 0
      UPLOAD_MAX_BYTES: 10485760
      RAW_RETENTION_DAYS: 90
      DERIVED_RETENTION_DAYS: 365
      TZ: UTC
    volumes:
      - raw_data:/app/uploads
      - ../../db/migrations:/app/migrations:ro
      - ${DB_PASSWORD_HOST_FILE}:/run/secrets/db_password:ro
    networks:
      - smoke
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 30

  worker:
    image: ${CHROMAT_API_IMAGE}
    command: ["node", "src/worker.js"]
    environment:
      APP_ENV: smoke
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD_FILE: /run/secrets/db_password
      RAW_DATA_DIR: /app/uploads
      WORKER_LEASE_SECONDS: 2
      WORKER_POLL_MS: 100
      WORKER_PROCESSING_DELAY_MS: 100
      INFERENCE_URL: http://inference:8000
      INFERENCE_MODEL_VERSION: deterministic-1
      INFERENCE_MODEL_SHA256: 785e60645aad9f5dd512ca275ff4db78bea9797d6cff2979530fd6bb24db46f3
      OFFICIAL_ALGORITHM: hsv
      AGGREGATION_RULE_VERSION: 1
      AGGREGATION_CONFIDENCE_THRESHOLD: 0.8
      AGGREGATION_CONSECUTIVE_EVENTS: 3
      AGGREGATION_MAX_EVENT_AGE_MS: 604800000
      AGGREGATION_MIN_ALERT_INTERVAL_MS: 0
      TZ: UTC
    volumes:
      - raw_data:/app/uploads
      - ../../db/migrations:/app/migrations:ro
      - ${DB_PASSWORD_HOST_FILE}:/run/secrets/db_password:ro
    networks:
      - smoke
    depends_on:
      db:
        condition: service_healthy
      inference:
        condition: service_healthy

  telegram-worker:
    image: ${CHROMAT_API_IMAGE}
    command: ["node", "src/telegram-worker.js"]
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD_FILE: /run/secrets/db_password
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      PANEL_URL: https://localhost/panel/
      ALERT_POLL_MS: 100
      ALERT_LEASE_SECONDS: 2
      TELEGRAM_API_URL: http://telegram-stub:8080
      TZ: UTC
    volumes:
      - ../../db/migrations:/app/migrations:ro
      - ${DB_PASSWORD_HOST_FILE}:/run/secrets/db_password:ro
      - ${TELEGRAM_BOT_TOKEN_HOST_FILE}:/run/secrets/telegram_bot_token:ro
    networks:
      - smoke
    depends_on:
      db:
        condition: service_healthy
      telegram-stub:
        condition: service_started

  telegram-stub:
    image: nginx:1.29.2-alpine
    volumes:
      - ./telegram-stub.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - smoke

  inference:
    build:
      context: ../../inference
      dockerfile: Dockerfile
    image: ${CHROMAT_INFERENCE_IMAGE}
    environment:
      INFERENCE_PORT: 8000
      MODEL_PATH: /app/models/deterministic-model.json
      MODEL_VERSION: deterministic-1
      MODEL_SHA256: 785e60645aad9f5dd512ca275ff4db78bea9797d6cff2979530fd6bb24db46f3
    volumes:
      - ../../inference/models/deterministic-model.json:/app/models/deterministic-model.json:ro
    networks:
      - smoke
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 2s
      timeout: 5s
      retries: 30

  nginx:
    image: nginx:1.29.2-alpine
    volumes:
      - ../../nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../web/public:/usr/share/nginx/html:ro
      - ${TLS_CERT_HOST_PATH}:/etc/nginx/tls/server.crt:ro
      - ${TLS_KEY_HOST_PATH}:/etc/nginx/tls/server.key:ro
    networks:
      - smoke
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://api:3000/health/ready || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30

  smoke-client:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      BASE_URL: https://nginx
      CA_CERT: /runtime/server.crt
      ADMIN_USERNAME: ${SMOKE_ADMIN_USERNAME}
      SMOKE_SOURCE_NAME: ${SMOKE_SOURCE_NAME}
      SMOKE_RUNTIME_DIR: /runtime
      SMOKE_INTERNAL_CLIENT: "true"
      SMOKE_TESTS: ${SMOKE_TESTS:-all}
      TELEGRAM_API_URL: http://telegram-stub:8080
      TMPDIR: /runtime/tmp
    user: "${SMOKE_CLIENT_UID}:${SMOKE_CLIENT_GID}"
    volumes:
      - ./:/workspace/tests/smoke:ro
      - ${SMOKE_CLIENT_RUNTIME_DIR}:/runtime
      - ${TLS_CERT_HOST_PATH}:/runtime/server.crt:ro
      - ${OPERATOR_PASSWORD_HOST_FILE}:/runtime/operator_password:ro
    networks:
      - smoke
    depends_on:
      nginx:
        condition: service_healthy

  operator-bootstrap:
    image: ${CHROMAT_API_IMAGE}
    command: ["npm", "run", "create-operator", "--", "${SMOKE_ADMIN_USERNAME}"]
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD_FILE: /run/secrets/db_password
      OPERATOR_PASSWORD_FILE: /run/secrets/operator_password
    volumes:
      - ../../db/migrations:/app/migrations:ro
      - ${DB_PASSWORD_HOST_FILE}:/run/secrets/db_password:ro
      - ${OPERATOR_PASSWORD_HOST_FILE}:/run/secrets/operator_password:ro
    networks:
      - smoke
    depends_on:
      db:
        condition: service_healthy

networks:
  smoke:
    internal: true

volumes:
  db_data:
  raw_data:
