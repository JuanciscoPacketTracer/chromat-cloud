name: chromat

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "90"

services:
  db:
    image: mariadb:11.8.2
    restart: unless-stopped
    logging: *default-logging
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: ${TZ}
    volumes:
      - db_data:/var/lib/mysql
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mariadb -h 127.0.0.1 -u root -p\"$${MARIADB_ROOT_PASSWORD}\" -e \"SELECT 1 FROM schema_migrations WHERE version = '001_initial' LIMIT 1\" --skip-column-names | grep -q 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    restart: unless-stopped
    logging: *default-logging
    build:
      context: ./api
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    image: chromat-api:dev
    environment:
      APP_ENV: ${APP_ENV}
      API_PORT: ${API_PORT}
      DB_HOST: db
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      RAW_DATA_DIR: ${RAW_DATA_DIR}
      RAW_MIN_FREE_PERCENT: ${RAW_MIN_FREE_PERCENT:-20}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES}
      RAW_RETENTION_DAYS: ${RAW_RETENTION_DAYS}
      DERIVED_RETENTION_DAYS: ${DERIVED_RETENTION_DAYS}
      TZ: ${TZ}
    volumes:
      - raw_data:/app/uploads
      - ./db/migrations:/app/migrations:ro
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  worker:
    restart: unless-stopped
    logging: *default-logging
    build:
      context: ./api
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    image: chromat-api:dev
    command: ["node", "src/worker.js"]
    environment:
      APP_ENV: ${APP_ENV}
      DB_HOST: db
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      RAW_DATA_DIR: ${RAW_DATA_DIR}
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS}
      WORKER_POLL_MS: ${WORKER_POLL_MS}
      WORKER_PROCESSING_DELAY_MS: ${WORKER_PROCESSING_DELAY_MS}
      INFERENCE_URL: ${INFERENCE_URL}
      INFERENCE_MODEL_VERSION: ${INFERENCE_MODEL_VERSION}
      INFERENCE_MODEL_SHA256: ${INFERENCE_MODEL_SHA256}
      OFFICIAL_ALGORITHM: ${OFFICIAL_ALGORITHM}
      AGGREGATION_RULE_VERSION: ${AGGREGATION_RULE_VERSION}
      AGGREGATION_CONFIDENCE_THRESHOLD: ${AGGREGATION_CONFIDENCE_THRESHOLD}
      AGGREGATION_CONSECUTIVE_EVENTS: ${AGGREGATION_CONSECUTIVE_EVENTS}
      AGGREGATION_MAX_EVENT_AGE_MS: ${AGGREGATION_MAX_EVENT_AGE_MS}
      AGGREGATION_MIN_ALERT_INTERVAL_MS: ${AGGREGATION_MIN_ALERT_INTERVAL_MS}
      TZ: ${TZ}
    volumes:
      - raw_data:/app/uploads
      - ./db/migrations:/app/migrations:ro
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
      inference:
        condition: service_healthy

  telegram-worker:
    restart: unless-stopped
    logging: *default-logging
    build:
      context: ./api
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    image: chromat-api:dev
    command: ["node", "src/telegram-worker.js"]
    environment:
      DB_HOST: db
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      PANEL_URL: ${PANEL_URL}
      ALERT_POLL_MS: ${ALERT_POLL_MS}
      ALERT_LEASE_SECONDS: ${ALERT_LEASE_SECONDS}
      TZ: ${TZ}
    volumes:
      - ./db/migrations:/app/migrations:ro
      - ${TELEGRAM_BOT_TOKEN_HOST_FILE}:/run/secrets/telegram_bot_token:ro
    networks:
      - internal
      - edge
    depends_on:
      db:
        condition: service_healthy

  inference:
    restart: unless-stopped
    logging: *default-logging
    build:
      context: ./inference
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    image: chromat-inference:dev
    environment:
      INFERENCE_PORT: ${INFERENCE_PORT}
      MODEL_PATH: /app/models/deterministic-model.json
      MODEL_VERSION: ${INFERENCE_MODEL_VERSION}
      MODEL_SHA256: ${INFERENCE_MODEL_SHA256}
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  nginx:
    image: nginx:1.29.2-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "443:443"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/public:/usr/share/nginx/html:ro
      - ./certs/dev/server.crt:/etc/nginx/tls/server.crt:ro
      - ./certs/dev/server.key:/etc/nginx/tls/server.key:ro
    networks:
      - edge
      - internal
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider --no-check-certificate https://127.0.0.1/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

networks:
  edge:
    name: chromat_edge
  internal:
    name: chromat_internal
    internal: true

volumes:
  db_data:
    name: chromat_db_data
  raw_data:
    name: chromat_raw_data
